name: Storm Revolution Standalone APK Build

on:
  push:
    branches: [android-app-bootstrap]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standalone-runtime:
    name: Build Storm launcher with embedded Mali runtime
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout launcher configuration
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Fetch pinned Winlator Mali runtime source
        run: |
          git clone --depth 1 --branch bionic-mali-1.2 --recurse-submodules \
            https://github.com/GunaCharanTeja/WinlatorMali.git winlator
          cd winlator
          test "$(git rev-parse HEAD)" = "0411a4b602ed00d71bef52e6a7ccb82a8e709b1a"
          git submodule update --init --recursive

      - name: Apply Storm branding
        run: python3 scripts/patch_winlator_branding.py winlator/app/build.gradle

      - name: Install custom Storm home screen and game launcher
        run: python3 scripts/patch_storm_home.py winlator

      - name: Build standalone Storm launcher APK
        working-directory: winlator
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLudashiDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="winlator/app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload standalone Storm APK
        uses: actions/upload-artifact@v4
        with:
          name: storm-revolution-standalone-mali-apk
          path: winlator/app/build/outputs/apk/ludashi/debug/app-ludashi-debug.apk
          if-no-files-found: error
          retention-days: 14
