
name: Storm Launcher Android ARM64 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Storm Launcher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Platform, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.31.5"

      - name: Verify Android Development Environment
        run: |
          java -version
          sdkmanager --list_installed
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Clean Previous Build
        run: |
          gradle --no-daemon clean

      - name: Run Unit Tests
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            -PenableNativeBridge=true \
            --stacktrace

      - name: Build Android ARM64 APK
        run: |
          gradle --no-daemon \
            :app:assembleDebug \
            -PenableNativeBridge=true \
            --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Launcher-Android-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
