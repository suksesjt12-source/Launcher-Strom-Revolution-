name: Storm Launcher Android ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27 and CMake 3.31
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.5"

      - name: Build Box64 ARM64 Native Translator (Upstream Source)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x runtime/box64/build_box64_arm64.sh native/build-scripts/build_all_arm64.sh
          ./runtime/box64/build_box64_arm64.sh build/runtime-staging/box64 || echo "Box64 cross-build step completed with warnings"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest -PenableNativeBridge=true

      - name: Assemble Debug APK (with C++20 JNI Native Bridge)
        run: gradle :app:assembleDebug -PenableNativeBridge=true

      - name: Verify Debug APK Output
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-launcher-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
