
name: Storm Launcher Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      # 4. Install Android development packages
      - name: Install SDK NDK and CMake
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Verify environment
      - name: Verify Development Environment
        shell: bash
        run: |
          set -e

          java -version
          gradle --version
          sdkmanager --list_installed

          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_SDK_ROOT/cmake/3.31.5/bin/cmake"

          echo "Android SDK verified"
          echo "Android NDK verified"
          echo "CMake verified"

      # 7. Clean project
      - name: Clean Gradle Project
        run: |
          gradle --no-daemon \
            --console=plain \
            clean

      # 8. Build APK
      - name: Build ARM64 Debug APK
        run: |
          gradle --no-daemon \
            --console=plain \
            :app:assembleDebug \
            -PenableNativeBridge=true \
            --stacktrace

      # 9. Verify APK
      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          unzip -t "$APK" >/dev/null

          if ! unzip -Z1 "$APK" | grep -q \
            '^lib/arm64-v8a/libstorm_runtime_bridge.so$'; then
            echo "ERROR: ARM64 native bridge is missing"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_OUTPUT"

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      # 10. Upload APK before running tests
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Launcher-ARM64-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 11. Run unit tests
      # Test failure will not remove the uploaded APK.
      - name: Run Unit Tests
        continue-on-error: true
        run: |
          gradle --no-daemon \
            --console=plain \
            :app:testDebugUnitTest \
            -PenableNativeBridge=true \
            --stacktrace

      # 12. Build report
      - name: Build Summary
        if: always()
        run: |
          echo "## Storm Launcher Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target ABI: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: 36.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- NDK: 28.2.13676358" >> "$GITHUB_STEP_SUMMARY"
          echo "- CMake: 3.31.5" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle: 9.3.1" >> "$GITHUB_STEP_SUMMARY"
